<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jason Uithol — Career</title>
<meta name="description" content="Jason Uithol: full stack developer. Career history across .NET, SQL, security, APIs and frontend, filterable by skill." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="career.css" />
</head>
<body>

<div class="gate" id="gate">
  <button class="power" id="power" type="button" aria-label="Power on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.9a8 8 0 1 0 11.2 0"/></svg>
  </button>
  <p class="silk">Power on</p>
</div>

<main class="board" id="board">
  <div class="board-inner">

    <header class="hdr">
      <h1 id="name"></h1>
      <p class="loc silk" id="location"></p>
      <div class="summary" id="summary"></div>
      <nav class="links">
        <a class="silk-btn" href="https://github.com/jasonuithol">GitHub</a>
        <a class="silk-btn" id="seek-link" href="https://au.seek.com/profiles/jason-uithol-wcqclsrjh8">SEEK profile</a>
      </nav>
    </header>

    <section class="bay" aria-label="Skill filters">
      <p class="silk silk-small bay-label">Select a chip to trace that skill through the history</p>
      <div class="chips" id="chips"></div>
      <svg class="fanout" id="fanout" aria-hidden="true"></svg>
    </section>

    <section class="history" id="history" aria-live="polite"></section>

    <section class="extras" id="extras"></section>

    <footer class="foot silk silk-small" id="foot"></footer>
  </div>
</main>

<script src="circuit-audio.js"></script>
<script src="career.js"></script>
</body>
</html>
